# /etc/nginx/sites-available/george  ->  symlink into sites-enabled
# Cert: certbot certonly --dns-cloudflare -d george.jackhogan.me

server {
    listen 80;
    listen [::]:80;
    server_name george.jackhogan.me;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name george.jackhogan.me;
    ssl_certificate     /etc/letsencrypt/live/george.jackhogan.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/george.jackhogan.me/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:3031;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
