# /etc/nginx/sites-available/george  ->  symlink into sites-enabled
# Cert: certbot certonly --dns-cloudflare -d george.jackhogan.me -d '*.george.jackhogan.me' -d pds.jackhogan.me

server {
    listen 80;
    listen [::]:80;
    server_name george.jackhogan.me *.george.jackhogan.me pds.jackhogan.me;
    return 301 https://$host$request_uri;
}

# App (SvelteKit)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name george.jackhogan.me;
    ssl_certificate     /etc/letsencrypt/live/george.jackhogan.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/george.jackhogan.me/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:3031;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

# PDS + user handles (*.george.jackhogan.me serves /.well-known/atproto-did)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name pds.jackhogan.me *.george.jackhogan.me;
    ssl_certificate     /etc/letsencrypt/live/george.jackhogan.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/george.jackhogan.me/privkey.pem;

    client_max_body_size 100m;

    # george's signup page runs on this origin: the PDS's WebAuthn relying party is its own host.
    location = /signup {
        proxy_pass http://127.0.0.1:3031;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    }
    location /_app/ {
        proxy_pass http://127.0.0.1:3031;
    }

    location / {
        proxy_pass http://127.0.0.1:3030;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # com.atproto.sync.subscribeRepos is a long-lived websocket
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
    }
}
