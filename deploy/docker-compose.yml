# Tranquil PDS for george. TLS is terminated by the host nginx (see nginx/).
# Image is built from a Tranquil checkout: see README.md.
services:
  tranquil-pds:
    image: tranquil-pds:local
    restart: unless-stopped
    environment:
      SERVER_HOST: "[::]"
    ports:
      - "127.0.0.1:3030:3000"
    volumes:
      - ./tranquil/config.toml:/etc/tranquil-pds/config.toml:ro
      - blob_data:/var/lib/tranquil-pds/blobs
      - store_data:/var/lib/tranquil-pds/store
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/local/bin/tranquil-pds", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tranquil_pds
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_password
      POSTGRES_DB: pds
    secrets:
      - pg_password
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tranquil_pds -d pds"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

secrets:
  pg_password:
    file: ./tranquil/pg_password

volumes:
  postgres_data:
  blob_data:
  store_data:
