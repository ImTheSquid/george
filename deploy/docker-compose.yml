# george. TLS is terminated by the host nginx (see nginx/).
services:
  george:
    build:
      context: ../src
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: /data/george.db
      APP_URL: https://george.jackhogan.me
      INVITE_REQUIRED: "1"
      HOST_HEADER: x-forwarded-host
      PROTOCOL_HEADER: x-forwarded-proto
      ADDRESS_HEADER: X-Forwarded-For
      XFF_DEPTH: "1"
    ports:
      - "127.0.0.1:3031:3000"
    volumes:
      - george_data:/data

volumes:
  george_data:
